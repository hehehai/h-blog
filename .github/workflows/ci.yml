name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Article lastModified values are derived from Git history.
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version-file: package.json
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      # Build generates content-collections types and the TanStack route tree.
      - run: vp build
      - run: vp run check-types
      # Keep the existing Ultracite/Biome policy during the toolchain migration.
      - run: vp run check
