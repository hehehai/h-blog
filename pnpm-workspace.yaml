allowBuilds:
  es5-ext: false
  esbuild: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
# Keep pnpm's one-day protection; only these exact releases were approved for
# the latest-version upgrade on 2026-10-12 (including Radix's matching internals).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@radix-ui/primitive@1.2.0"
  - "@radix-ui/react-accordion@1.3.0"
  - "@radix-ui/react-arrow@1.1.17"
  - "@radix-ui/react-avatar@1.3.0"
  - "@radix-ui/react-checkbox@1.4.0"
  - "@radix-ui/react-collapsible@1.2.0"
  - "@radix-ui/react-collection@1.2.0"
  - "@radix-ui/react-context@1.3.0"
  - "@radix-ui/react-dialog@1.3.0"
  - "@radix-ui/react-direction@1.2.0"
  - "@radix-ui/react-dismissable-layer@1.2.0"
  - "@radix-ui/react-focus-guards@1.2.0"
  - "@radix-ui/react-focus-scope@1.3.0"
  - "@radix-ui/react-label@2.1.17"
  - "@radix-ui/react-popover@1.3.0"
  - "@radix-ui/react-popper@1.4.0"
  - "@radix-ui/react-portal@1.2.0"
  - "@radix-ui/react-primitive@2.2.0"
  - "@radix-ui/react-radio-group@1.5.0"
  - "@radix-ui/react-roving-focus@1.2.0"
  - "@radix-ui/react-scroll-area@1.4.0"
  - "@radix-ui/react-select@2.4.0"
  - "@radix-ui/react-slider@1.6.0"
  - "@radix-ui/react-slot@1.5.0"
  - "@radix-ui/react-switch@1.4.0"
  - "@radix-ui/react-tabs@1.2.0"
  - "@radix-ui/react-toggle@1.2.0"
  - "@radix-ui/react-tooltip@1.4.0"
  - "@radix-ui/react-use-callback-ref@1.1.5"
  - "@radix-ui/react-use-controllable-state@1.3.0"
  - "@radix-ui/react-visually-hidden@1.2.13"
  - "zod@4.6.6"
overrides:
  # Typography still pins v6; v7.1.6 fixes GHSA-rj75-hqrm-r3gf.
  "@tailwindcss/typography>postcss-selector-parser": 7.1.6
  vite@*: "catalog:"
patchedDependencies:
  # Local depth guards for GHSA-vfj7-8cjw-p6xm; see docs/braces-mitigation.md.
  braces@3.0.3: patches/braces@3.0.3.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
